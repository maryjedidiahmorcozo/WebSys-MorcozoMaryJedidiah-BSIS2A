<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Weather Checker</title>
</head>
<body>
    <h2>Weather Checker</h2>
    <input type="text" id="city" placeholder="Enter city name" />
    <button onclick="getWeather()">Get Weather</button>
    <div id="weatherResult"></div>

    <script>
        function getWeather() {
            const city = document.getElementById("city").value;
            const apiKey = "164afcc6119353be325f3c4557aa1e4f"; // Replace with your actual API key
            const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data.cod === 200) {
                        document.getElementById("weatherResult").innerHTML = `
                            <p>${data.weather[0].description}</p>
                            <p>Temperature: ${data.main.temp}°C</p>
                            <img src="https://openweathermap.org/img/w/${data.weather[0].icon}.png" alt="${data.weather[0].description}">
                        `;
                    } else {
                        document.getElementById("weatherResult").innerText = "City not found.";
                    }
                })
                .catch(error => {
                    console.error("Error fetching weather data:", error);
                    document.getElementById("weatherResult").innerText = "Error fetching data.";
                });
        }
    </script>
</body>
</html>
